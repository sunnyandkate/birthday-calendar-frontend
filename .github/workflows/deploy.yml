name: Build and Deploy React App to Subdomain

on:
  push:
    branches:
      - main  # Adjust this to "master" if your primary branch uses that name

jobs:
  web-deploy:
    name: 🚀 Deploy Website
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install Dependencies
      run: npm install

    - name: 🏗️ Compile React Production Build
      run: npm run build 

    - name: 📂 Upload Files via FTP to Subdomain
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/ 
        server-dir: /public_html/projects/halloween-birthday-calendar/
